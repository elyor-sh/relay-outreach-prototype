.lamp.has { filter: saturate(.75) brightness(.8); }
.lamp.is-on, .lamp:hover { filter: none; }
.lamp.is-on.l-red { box-shadow: 0 0 18px rgba(239, 68, 68, .9); }
.lamp.is-on.l-yellow { box-shadow: 0 0 18px rgba(245, 158, 11, .9); }
.lamp.is-on.l-green { box-shadow: 0 0 18px rgba(34, 197, 94, .9); }
.traffic-legend { display: grid; gap: 3px; }
.tl-leg { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 9px; border-radius: 9px; text-align: left; font-weight: 600; font-size: .92em; }
.tl-leg:hover { background: var(--surface-2); }
.tl-leg.is-on { background: var(--primary-soft); }
.ib-search { display: flex; gap: 8px; padding: 4px 16px 10px; }
.search { position: relative; flex: 1; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .inp { padding-left: 32px; }
.threads { flex: 1; overflow: auto; padding: 0 8px 10px; }
.th { width: 100%; display: grid; grid-template-columns: 10px 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 8px; border-radius: 12px; text-align: left; transition: background .15s; animation: fadeUp .35s var(--ease) both; }
.th:hover { background: var(--surface-2); }
.th.is-sel { background: var(--primary-soft); }
.th-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.th-top { display: flex; justify-content: space-between; gap: 8px; }
.th-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.th.is-unread .th-top b { font-weight: 800; }
.th.is-unread .th-top b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--primary); vertical-align: middle; }
.th-top time { color: var(--muted); font-size: .78em; flex: none; }
.th-sub { display: flex; align-items: center; gap: 6px; min-width: 0; }
.th-sub span { color: var(--muted); font-size: .88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib-none { padding: 20px; text-align: center; }
.ib-empty { flex: 1; display: grid; place-items: center; align-content: center; gap: 10px; color: var(--muted); padding: 30px; text-align: center; }
.ib-empty .i { width: 40px; height: 40px; }
.thread-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.thread-head div { display: flex; flex-direction: column; }
.thread-head small { color: var(--muted); }
.stop-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(239, 68, 68, .12); color: #EF4444; font-weight: 650; font-size: .84em; }
.thread-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--surface-2); }
.msg { --c: #6366F1; max-width: 78%; display: flex; flex-direction: column; gap: 5px; padding: 10px 13px; border-radius: 16px; animation: fadeUp .35s var(--ease) both; }
.msg.out { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); border-right: 3px solid var(--c); border-radius: 16px 16px 4px 16px; }
.msg.out.you { background: var(--primary-soft); border-right-color: var(--primary); }
.msg.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 16px 16px 16px 4px; box-shadow: var(--shadow); }
.msg.in.l-green { border-left-color: var(--green); }
.msg.in.l-yellow { border-left-color: var(--yellow); }
.msg.in.l-red { border-left-color: var(--red); }
.msg.in.auto { opacity: .75; border-style: dashed; }
.msg-meta { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8em; }
.msg-meta small { opacity: .8; }
.msg-meta time { margin-left: auto; }
.msg-subj { font-weight: 700; margin-bottom: 4px; }
.msg-body { line-height: 1.5; font-size: .95em; }
.msg-media { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .82em; }
.msg-foot { color: var(--muted); font-size: .76em; text-align: right; }
.msg-foot .read { color: #0EA5E9; font-weight: 600; }
.ai-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 650; }
.stop-divider { align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0; padding: 8px; border-radius: 10px; background: rgba(239, 68, 68, .08); border: 1px dashed rgba(239, 68, 68, .4); color: #EF4444; font-weight: 650; font-size: .88em; animation: pop .4s var(--spring); }
.call-card { align-self: flex-end; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: .9em; }
.call-card div { display: flex; flex-direction: column; }

const PLURALS = { ru: new Intl.PluralRules('ru-RU'), en: new Intl.PluralRules('en-US') };
const RU_FORM = { one: 0, few: 1, many: 2, other: 2 };
const missingKeys = new Set();

/** Translate `key` into the current UI language with `{param}` interpolation and plurals. */
function t(key, vars) {
  const entry = I18N[key];
  if (!entry) {
    if (!missingKeys.has(key)) { missingKeys.add(key); console.warn(`[i18n] missing key: ${key}`); }
    return key;
  }
  const lang = (typeof state !== 'undefined' && state.ui.lang) || 'ru';
  let s = entry[lang === 'en' ? 1 : 0];
  if (s.includes('|') && vars && typeof vars.n === 'number') {
    const forms = s.split('|');
    const cat = PLURALS[lang].select(vars.n);
    const idx = lang === 'en' ? (cat === 'one' ? 0 : 1) : RU_FORM[cat];
    s = forms[Math.min(idx, forms.length - 1)];
  }
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : s;
}

/* ---- src/engine.js ---- */
/**
 * Relay Engine — a deterministic discrete-event simulator of a multichannel
 * outreach sequence.
 *
 * The engine is pure and DOM-free. The very same module powers:
 *   - the live campaign monitor (playback of the event timeline),
 *   - the PRO-mode forecast (dry-run of the current settings),
 *   - the Node unit tests in /tests.
 *
 * Time model: integer minutes since Monday 00:00 UTC of the launch week.
 * Timezones are fixed UTC offsets (DST is intentionally ignored in the prototype).
 *
 * All "under the hood" protections live here, so the UI only has to *show* them:
 *   - auto-stop of the whole chain on a reply in ANY channel,
 *   - sending only inside the recipient's working hours (by phone-code timezone),
 *   - messenger cascade WhatsApp → Telegram → Signal → SMS,
 *   - per-mailbox / per-number / per-account daily limits with rotation,
 *   - no links in the first messenger message (anti-ban),
 *   - branching conditions: opened / not opened / clicked / no reply.
 */
const Engine = (() => {
  'use strict';

  const DAY = 1440;
  /** The sender works in Moscow time (UTC+3). */
  const SENDER_TZ = 3;
  /** Launch moment: Monday 10:00 sender time → 07:00 UTC. */
  const LAUNCH_T = 10 * 60 - SENDER_TZ * 60;
  /** Minutes between two consecutive leads — human-like throttling. */
  const STAGGER = 3;
  const MESSENGERS = ['whatsapp', 'telegram', 'signal'];
  const CASCADE_DEFAULT = ['whatsapp', 'telegram', 'signal', 'sms'];

  /** Relative likelihood that a message gets read, per channel. */
  const READ_FACTOR = { email: 1, linkedin: 0.9, whatsapp: 1.25, telegram: 1.2, signal: 1.2, sms: 1.1 };
  /** Relative likelihood of a human reply, per channel. */
  const REPLY_FACTOR = { email: 1, linkedin: 0.8, whatsapp: 1.5, telegram: 1.4, signal: 1.3, sms: 0.8 };

  /* ------------------------------------------------------------------ */
  /* Utilities                                                           */
  /* ------------------------------------------------------------------ */

  /** Small, fast, seedable PRNG (mulberry32). Same seed → same campaign. */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function next() {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  /* ------------------------------------------------------------------ */
  /* Timezone detection by phone code (longest prefix wins)              */
  /* ------------------------------------------------------------------ */

  const PHONE_TZ = [
    ['+7495', 3, 'moscow'], ['+7499', 3, 'moscow'], ['+7812', 3, 'spb'], ['+7343', 5, 'ekb'],
    ['+7383', 7, 'nsk'], ['+7727', 5, 'almaty'], ['+77', 5, 'almaty'], ['+7', 3, 'moscow'],
    ['+49', 1, 'berlin'], ['+44', 0, 'london'], ['+971', 4, 'dubai'], ['+33', 1, 'paris'],
    ['+34', 1, 'madrid'], ['+90', 3, 'istanbul'], ['+374', 4, 'yerevan'], ['+995', 4, 'tbilisi'],
    ['+381', 1, 'belgrade'], ['+81', 9, 'tokyo'], ['+65', 8, 'singapore'],
    ['+1212', -5, 'ny'], ['+1646', -5, 'ny'], ['+1917', -5, 'ny'], ['+1312', -6, 'chicago'],
    ['+1415', -8, 'sf'], ['+1650', -8, 'sf'], ['+1310', -8, 'la'], ['+1213', -8, 'la'], ['+1', -5, 'ny'],
    ['+5511', -3, 'saopaulo'], ['+55', -3, 'saopaulo'],
  ].map(([prefix, tz, city]) => ({ prefix, tz, city }));

  /**
   * Resolve a timezone from a phone number. Works on area codes where a country
   * spans several zones (+7 383 → Novosibirsk UTC+7, +1 415 → San Francisco UTC−8).
   * @returns {{prefix:string,tz:number,city:string}|null}
   */
  function tzFromPhone(phone) {
    const digits = '+' + String(phone || '').replace(/\D/g, '');
    if (digits.length < 4) return null;
    let best = null;
    for (const e of PHONE_TZ) {
      if (digits.startsWith(e.prefix) && (!best || e.prefix.length > best.prefix.length)) best = e;
    }
    return best;
  }

  /* ------------------------------------------------------------------ */
  /* Text helpers: SMS segments, link detection                          */
  /* ------------------------------------------------------------------ */

  const GSM7_BASIC = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
  const GSM7_EXT = '^{}\\[~]|€';

  /**
   * SMS segmentation. Latin text uses GSM-7 (160 chars per SMS); any Cyrillic
   * or emoji switches the whole message to UCS-2 (70 chars per SMS).
   */
  function smsInfo(text) {
    const s = String(text || '');
    let gsm = true;
    let gsmLen = 0;
    for (const ch of s) {
      if (GSM7_BASIC.includes(ch)) gsmLen += 1;
      else if (GSM7_EXT.includes(ch)) gsmLen += 2;
      else { gsm = false; break; }
    }
    const length = gsm ? gsmLen : s.length; // UCS-2 counts UTF-16 code units
    const single = gsm ? 160 : 70;
    const multi = gsm ? 153 : 67;
    const segments = length === 0 ? 0 : length <= single ? 1 : Math.ceil(length / multi);
    return { encoding: gsm ? 'GSM-7' : 'UCS-2', length, perSegment: single, segments };
  }

  const LINK_SRC = '(?:https?:\\/\\/|www\\.)\\S+|\\b[a-z0-9][a-z0-9-]*\\.(?:com|io|ru|app|co|net|org|me|ai|dev)(?:\\/\\S*)?';
  const LINK_TEST = new RegExp(LINK_SRC, 'i');
  const hasLink = (text) => LINK_TEST.test(String(text || ''));
  const findLinks = (text) => String(text || '').match(new RegExp(LINK_SRC, 'gi')) || [];
  /** Remove links and tidy whitespace — used for the "no links in the first message" rule. */
  const stripLinks = (text) => String(text || '')
    .replace(new RegExp(LINK_SRC, 'gi'), '')
    .replace(/[ \t]+([.,!?])/g, '$1')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/[ \t]+\n/g, '\n')
    .trim();

  /* ------------------------------------------------------------------ */
  /* Working-hours math                                                  */
  /* ------------------------------------------------------------------ */

  /** Local calendar info for a UTC minute in a fixed-offset timezone. dow: 0 = Monday. */
  function localInfo(t, tz) {
    const l = t + tz * 60;
    const day = Math.floor(l / DAY);
    const min = l - day * DAY;
    return { day, dow: ((day % 7) + 7) % 7, min, hh: Math.floor(min / 60), mm: min % 60 };
  }

  function inWindow(t, tz, rules) {
    const i = localInfo(t, tz);
    if (rules.skipWeekends && i.dow >= 5) return false;
    return i.min >= rules.workStart * 60 && i.min < rules.workEnd * 60;
  }

  /** The earliest moment ≥ t that falls into the recipient's working window. */
  function nextWindow(t, tz, rules) {
    const ws = rules.workStart * 60;
    const we = rules.workEnd * 60;
    let l = t + tz * 60;
    for (let guard = 0; guard < 21; guard++) {
      const day = Math.floor(l / DAY);
      const min = l - day * DAY;
      const dow = ((day % 7) + 7) % 7;
      const weekend = rules.skipWeekends && dow >= 5;
      if (!weekend && min >= ws && min < we) return l - tz * 60;
      l = !weekend && min < ws ? day * DAY + ws : (day + 1) * DAY + ws;
    }
    return t; // unreachable with sane rules
  }

  /** Daily capacity of a mailbox, taking the warm-up ramp into account. */
  function emailCap(mailbox, campaignDay, cfg) {
    if (!cfg.warmup || !cfg.warmup.enabled) return cfg.dailyLimit;
    return Math.min(cfg.dailyLimit, cfg.warmup.start + cfg.warmup.step * (mailbox.ageDays + campaignDay));
  }

  /** Which previous steps can be referenced by a branching condition. */
  function conditionSupport(step, campaign) {
    const ch = step.channel;
    const CH = campaign.channels;
    const readable = ch === 'email' ? !!CH.email.trackOpens : ch === 'messenger' || MESSENGERS.includes(ch) || (ch === 'linkedin' && step.kind === 'message');
    const clickable = hasLink(step.text) && (ch !== 'email' || !!CH.email.trackClicks) && !(isFirstMessengerStep(step, campaign) && messengerNoLinks(step, campaign));
    return { readable, clickable };
  }

  function isFirstMessengerStep(step, campaign) {
    const first = [...campaign.steps].sort((a, b) => a.day - b.day)
      .find((s) => s.channel === 'messenger' || MESSENGERS.includes(s.channel));
    return !!first && first.id === step.id;
  }

  function messengerNoLinks(step, campaign) {
    const CH = campaign.channels;
    if (step.channel === 'messenger') return MESSENGERS.every((m) => CH[m].noLinksFirst);
    return MESSENGERS.includes(step.channel) ? !!CH[step.channel].noLinksFirst : false;
  }

  /* ------------------------------------------------------------------ */
  /* Simulation                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * Run the whole campaign and return its full event timeline.
   * @param {object} campaign  {leads, steps, rules, channels}
   * @param {{seed?:number,startT?:number}} [opts]
   */
  function simulate(campaign, opts = {}) {
    const seed = (opts.seed ?? 42) >>> 0;
    const R = mulberry32(seed);
    const rand = (a, b) => a + Math.floor(R() * (b - a + 1));
    const rules = campaign.rules;
    const CH = campaign.channels;
    const leads = campaign.leads || [];
    const steps = (campaign.steps || [])
      .map((s, i) => ({ ...s, _i: i }))
      .sort((a, b) => a.day - b.day || a._i - b._i);
    const startT = opts.startT ?? LAUNCH_T;
    const startDay = Math.floor(startT / DAY);

    const events = [];
    let seq = 0;
    const emit = (t, lead, type, meta) => {
      const ev = { t: Math.round(t), seq: seq++, lead: lead ? lead.id : null, type };
      if (meta) Object.assign(ev, meta);
      events.push(ev);
      return ev;
    };

    // Priority queue as a sorted array (stable for equal timestamps).
    const queue = [];
    const push = (job) => {
      let lo = 0;
      let hi = queue.length;
      while (lo < hi) {
        const m = (lo + hi) >> 1;
        if (queue[m].t <= job.t) lo = m + 1; else hi = m;
      }
      queue.splice(lo, 0, job);
    };

    const usage = Object.create(null);
    const used = (k) => usage[k] || 0;
    const take = (k) => { usage[k] = used(k) + 1; };
    const cursor = Object.create(null); // round-robin cursors per resource pool
    const rotationLogged = new Set();
    const cascadeOrder = (rules.cascade || CASCADE_DEFAULT.map((id) => ({ id, on: true })))
      .filter((c) => c.on).map((c) => c.id);
    const S = new Map(); // runtime state per lead

    leads.forEach((lead, i) => {
      S.set(lead.id, {
        stopped: false, bounced: false, unsub: false, connected: false, invited: false,
        touches: 0, oooSent: false, msgFirst: Object.create(null), hist: Object.create(null), attempts: Object.create(null),
      });
      for (const step of steps) {
        const t = nominalTime(step, lead, i);
        push({ t, kind: 'step', lead, step });
        if (step.channel === 'linkedin' && step.kind !== 'message' && CH.linkedin.likeWarmup) {
          const lt = Math.max(startT + i * STAGGER, t - (CH.linkedin.warmupDays || 0) * DAY - 120);
          push({ t: lt, kind: 'like', lead, step });
        }
      }
    });

    function nominalTime(step, lead, i) {
      const base = startT + (step.day - 1) * DAY;
      if (step.sendAt === 'auto' || step.sendAt == null || step.sendAt === '') return base + i * STAGGER + rand(0, 2);
      const dayStart = Math.floor(base / DAY) * DAY;
      const t = dayStart + Number(step.sendAt) * 60 - lead.tz * 60 + (i % 20) * 2;
      return Math.max(t, startT + i * STAGGER);
    }

    function reachable(lead, c, st) {
      if (st.unsub) return false;
      switch (c) {
        case 'email': return !!lead.has.email && !st.bounced;
        case 'linkedin': return !!lead.has.linkedin;
        case 'whatsapp': case 'telegram': case 'signal': return !!lead.has[c];
        case 'sms': case 'call': return !!lead.has.phone;
        default: return false;
      }
    }

    function checkCondition(step, st) {
      if (!step.condition || step.condition === 'no_reply' || !step.ref) return { ok: true };
      const h = st.hist[step.ref];
      if (!h) return { ok: false, reason: 'ref_not_sent' };
      switch (step.condition) {
        case 'opened': return h.opened ? { ok: true } : { ok: false, reason: 'not_opened' };
        case 'not_opened': return !h.opened ? { ok: true } : { ok: false, reason: 'opened' };
        case 'clicked': return h.clicked ? { ok: true } : { ok: false, reason: 'not_clicked' };
        default: return { ok: true };
      }
    }

    /** Take a sending resource (mailbox, number, account quota) or return null if limits are exhausted. */
    function acquire(channel, step, t, lead) {
      const day = Math.floor(t / DAY);
      if (channel === 'email') {
        const cfg = CH.email;
        const pool = cfg.mailboxes.filter((m) => m.enabled);
        if (!pool.length) return null;
        const start = cursor.email || 0;
        const order = cfg.rotation === 'health'
          ? [...pool].sort((a, b) => b.health - a.health)
          : pool.map((_, k) => pool[(start + k) % pool.length]);
        for (let k = 0; k < order.length; k++) {
          const m = order[k];
          const key = `mb:${m.id}:${day}`;
          if (used(key) < emailCap(m, day - startDay, cfg)) {
            take(key);
            if (cfg.rotation !== 'health') cursor.email = (pool.indexOf(m) + 1) % pool.length;
            let rotatedFrom = null;
            const logKey = `${order[0].id}:${day}`;
            if (k > 0 && !rotationLogged.has(logKey)) { rotationLogged.add(logKey); rotatedFrom = order[0].address; }
            return { label: m.address, key, rotatedFrom };
          }
        }
        return null;
      }
      if (channel === 'linkedin') {
        const invite = step.kind !== 'message';
        const key = `li:${invite ? 'inv' : 'msg'}:${day}`;
        const cap = invite ? CH.linkedin.inviteLimit : (CH.linkedin.messageLimit || 50);
        if (used(key) >= cap) return null;
        take(key);
        return { label: invite ? 'invite' : 'message', key };
      }
      if (MESSENGERS.includes(channel)) {
        const cfg = CH[channel];
        const pool = cfg.numbers;
        const start = cursor[channel] || 0;
        for (let k = 0; k < pool.length; k++) {
          const idx = (start + k) % pool.length;
          const key = `num:${channel}:${pool[idx].id}:${day}`;
          if (used(key) < cfg.dailyPerNumber) {
            take(key);
            cursor[channel] = (idx + 1) % pool.length;
            return { label: pool[idx].label, key };
          }
        }
        return null;
      }
      if (channel === 'sms') {
        const key = `sms:${day}`;
        if (used(key) >= CH.sms.dailyLimit) return null;
        take(key);
        return { label: CH.sms.senderId, key };
      }
      if (channel === 'call') {
        const key = `call:${day}`;
        if (used(key) >= (CH.call.dailyLimit || 120)) return null;
        take(key);
        const ids = CH.call.callerIds || {};
        const label = CH.call.localPresence ? (ids[lead.city] || ids.default) : ids.default;
        return { label, key };
      }
      return null;
    }

    function richMedia(channel) {
      const cfg = CH[channel];
      if (channel === 'telegram' && cfg.videoNotes) return 'circle';
      return cfg.voiceNotes ? 'voice' : null;
    }

    /** People reply while awake (08:00–22:00 local), not at 3 AM. */
    function wakingTime(t, tz) {
      const i = localInfo(t, tz);
      if (i.min >= 8 * 60 && i.min < 22 * 60) return t;
      const dayStartLocal = (i.min < 8 * 60 ? i.day : i.day + 1) * DAY;
      return dayStartLocal + 8 * 60 - tz * 60 + rand(10, 150);
    }

    function altChannel(lead, channel, st) {
      const pref = ['email', 'telegram', 'whatsapp', 'linkedin'];
      return pref.find((c) => c !== channel && reachable(lead, c, st)) || channel;
    }

    function onLike(job) {
      const { lead } = job;
      if (!lead.has.linkedin) return;
      if (!inWindow(job.t, lead.tz, rules)) {
        push({ ...job, t: nextWindow(job.t, lead.tz, rules) + rand(5, 60) });
        return;
      }
      emit(job.t, lead, 'like', { channel: 'linkedin', step: job.step.id });
    }

    function onStep(job, st) {
      const { lead, step } = job;

      // 1) Branching condition — evaluated once, at the nominal time of the step.
      if (!job.checked) {
        const verdict = checkCondition(step, st);
        if (!verdict.ok) {
          emit(job.t, lead, 'skip', { step: step.id, channel: step.channel, reason: verdict.reason, ref: step.ref });
          return;
        }
        job.checked = true;
      }

      // 2) Working hours in the recipient's timezone.
      if (!inWindow(job.t, lead.tz, rules)) {
        const until = nextWindow(job.t, lead.tz, rules) + rand(4, 45);
        const info = localInfo(job.t, lead.tz);
        emit(job.t, lead, 'deferred', {
          step: step.id, channel: step.channel, until, local: info.min,
          reason: rules.skipWeekends && info.dow >= 5 ? 'weekend' : 'night',
        });
        push({ ...job, t: until });
        return;
      }

      // 3) Channel resolution: messenger cascade or a fixed channel.
      let channel = step.channel;
      let tried = null;
      if (channel === 'messenger') {
        const found = cascadeOrder.find((c) => reachable(lead, c, st));
        if (!found) { emit(job.t, lead, 'no_channel', { step: step.id, channel: 'messenger' }); return; }
        const pos = cascadeOrder.indexOf(found);
        if (pos > 0) tried = cascadeOrder.slice(0, pos);
        channel = found;
      } else if (!reachable(lead, channel, st)) {
        emit(job.t, lead, 'skip', { step: step.id, channel, reason: channel === 'email' && st.bounced ? 'bounced' : 'no_contact' });
        return;
      }
      if (channel === 'linkedin' && step.kind === 'message' && !st.connected) {
        emit(job.t, lead, 'skip', { step: step.id, channel, reason: 'not_connected' });
        return;
      }
      if (channel === 'linkedin' && step.kind !== 'message' && st.invited) {
        emit(job.t, lead, 'skip', { step: step.id, channel, reason: 'already_invited' });
        return;
      }

      // 4) Rate limits & resource rotation.
      const res = acquire(channel, step, job.t, lead);
      if (!res) {
        const day = Math.floor(job.t / DAY);
        const until = nextWindow((day + 1) * DAY, lead.tz, rules) + rand(4, 60);
        emit(job.t, lead, 'limit', { step: step.id, channel, until });
        push({ ...job, t: until });
        return;
      }
      if (tried) emit(job.t, lead, 'cascade', { step: step.id, channel, tried });
      if (res.rotatedFrom) emit(job.t, lead, 'rotation', { step: step.id, channel, from: res.rotatedFrom, to: res.label });
      st.touches++;

      if (channel === 'call') { onCall(job, st, res); return; }

      // 5) Messenger safety: links in the first message, typing, rich media.
      const isMsgr = MESSENGERS.includes(channel);
      const link = hasLink(step.text);
      const linkStripped = isMsgr && !st.msgFirst[channel] && link && !!CH[channel].noLinksFirst;
      emit(job.t, lead, 'send', {
        step: step.id, channel, via: res.label, kind: step.kind || 'message',
        typing: isMsgr && CH[channel].typing ? rand(3, 12) : 0,
        media: isMsgr ? richMedia(channel) : null,
        linkStripped, local: localInfo(job.t, lead.tz).min,
      });
      if (linkStripped) emit(job.t, lead, 'link_stripped', { step: step.id, channel });
      st.msgFirst[channel] = true;
      if (channel === 'linkedin' && step.kind !== 'message') st.invited = true;
      const hist = { channel, t: job.t, opened: false, clicked: false, link: link && !linkStripped };
      st.hist[step.id] = hist;
      scheduleOutcomes(job, st, channel, hist);
    }

    function scheduleOutcomes(job, st, channel, hist) {
      const { lead, step, t } = job;
      const P = lead.persona;
      if (channel === 'email' && !lead.emailValid) {
        push({ t: t + rand(1, 4), kind: 'outcome', type: 'bounce', lead, step });
        return;
      }
      const isInvite = channel === 'linkedin' && step.kind !== 'message';
      if (isInvite && R() < P.accept) push({ t: t + rand(90, 2200), kind: 'outcome', type: 'accepted', lead, step });

      const reads = !isInvite && R() < clamp01(P.open * (READ_FACTOR[channel] || 1));
      const readT = t + rand(6, 540);
      if (reads) {
        const observable = channel === 'email' ? !!CH.email.trackOpens : MESSENGERS.includes(channel) || channel === 'linkedin';
        push({ t: readT, kind: 'outcome', type: 'open', lead, step, observable });
        if (hist.link && R() < P.click) {
          const clickObservable = channel !== 'email' || !!CH.email.trackClicks;
          push({ t: readT + rand(1, 25), kind: 'outcome', type: 'click', lead, step, observable: clickObservable });
        }
      }

      const boost = 1 + 0.18 * (st.touches - 1); // persistence pays off a little
      const pReply = P.reply * (REPLY_FACTOR[channel] || 1) * (reads || isInvite ? 1 : 0.2) * boost;
      if (R() < pReply) {
        const rt = wakingTime((reads ? readT : t) + rand(12, 900), lead.tz);
        const replyCh = R() > 0.78 ? altChannel(lead, channel, st) : channel;
        push({ t: rt, kind: 'outcome', type: 'reply', lead, step, channel: replyCh });
      } else if (channel === 'email' && lead.ooo && !st.oooSent) {
        st.oooSent = true;
        push({ t: t + rand(1, 3), kind: 'outcome', type: 'auto_reply', lead, step, channel: 'email' });
      }
    }

    function onCall(job, st, res) {
      const { lead, step } = job;
      const C = CH.call;
      const P = lead.persona;
      const attempt = (st.attempts[step.id] = (st.attempts[step.id] || 0) + 1);
      emit(job.t, lead, 'call', { step: step.id, channel: 'call', via: res.label, localNumber: !!C.localPresence, attempt });
      st.hist[step.id] = { channel: 'call', t: job.t, opened: false, clicked: false, link: false };

      // Local caller ID noticeably lifts the pickup rate.
      const pickup = clamp01(0.34 * (C.localPresence ? 1.45 : 1) * (0.6 + P.open * 0.6));
      const r = R();
      if (r < pickup) {
        const minutes = rand(2, 7);
        const positive = P.intent === 'interested' ? R() < 0.8 : P.intent === 'question' ? R() < 0.35 : false;
        emit(job.t + 1, lead, 'call_talk', { step: step.id, channel: 'call', who: C.mode === 'manager' ? 'manager' : 'ai', voice: C.aiVoice, minutes });
        const intent = positive ? 'interested' : (P.intent === 'negative' || P.intent === 'stop') ? 'negative' : 'later';
        if (positive && C.mode === 'hybrid') emit(job.t + minutes, lead, 'transfer', { step: step.id, channel: 'call', manager: C.transferTo });
        push({ t: job.t + minutes + 1, kind: 'outcome', type: 'reply', lead, step, channel: 'call', intent, meeting: positive });
        return;
      }
      if (r < pickup + 0.4) {
        if (!C.amd) {
          emit(job.t + 1, lead, 'machine', { step: step.id, channel: 'call', seconds: rand(25, 50) });
          return;
        }
        emit(job.t + 1, lead, 'amd', { step: step.id, channel: 'call', action: C.amdAction });
        if (C.amdAction === 'retry' && attempt < C.maxAttempts) {
          push({ ...job, t: job.t + DAY + rand(-40, 40), checked: true });
        } else if (C.amdAction === 'sms' && reachable(lead, 'sms', st)) {
          emit(job.t + 2, lead, 'send', { step: step.id, channel: 'sms', via: CH.sms.senderId, kind: 'call_followup', local: localInfo(job.t, lead.tz).min });
        }
        return;
      }
      emit(job.t + 1, lead, 'no_answer', { step: step.id, channel: 'call', attempt });
      if (attempt < C.maxAttempts) push({ ...job, t: job.t + rand(180, 300), checked: true });
    }

    function stopLead(t, lead, st, reason, channel) {
      st.stopped = true;
      let cancelled = 0;
      for (let i = queue.length - 1; i >= 0; i--) {
        const j = queue[i];
        if (j.lead.id === lead.id && j.kind !== 'outcome') {
          if (j.kind === 'step') cancelled++;
          queue.splice(i, 1);
        }
      }
      emit(t, lead, 'auto_stop', { reason, channel, cancelled });
    }

    function onOutcome(job, st) {
      const { lead, step } = job;
      const h = st.hist[step.id];
      switch (job.type) {
        case 'open':
          if (job.observable && !st.stopped) { h.opened = true; emit(job.t, lead, 'open', { step: step.id, channel: h.channel }); }
          break;
        case 'click':
          if (job.observable && !st.stopped) { h.clicked = true; h.opened = true; emit(job.t, lead, 'click', { step: step.id, channel: h.channel }); }
          break;
        case 'accepted':
          st.connected = true;
          if (!st.stopped) emit(job.t, lead, 'accepted', { step: step.id, channel: 'linkedin' });
          break;
        case 'bounce':
          st.bounced = true;
          emit(job.t, lead, 'bounce', { step: step.id, channel: 'email', fallback: !!rules.bounceFallback });
          if (!rules.bounceFallback && !st.stopped) stopLead(job.t, lead, st, 'bounce', 'email');
          break;
        case 'auto_reply':
          if (st.stopped) break;
          emit(job.t, lead, 'auto_reply', { step: step.id, channel: 'email', ignored: !!rules.ignoreAutoReply });
          if (!rules.ignoreAutoReply) stopLead(job.t, lead, st, 'auto_reply', 'email');
          break;
        case 'reply': {
          if (st.stopped) break;
          const intent = job.intent || lead.persona.intent;
          emit(job.t, lead, 'reply', { step: step.id, channel: job.channel, intent, variant: lead.persona.variant || 0 });
          if (intent === 'stop') { st.unsub = true; emit(job.t, lead, 'unsubscribe', { channel: job.channel }); }
          if (job.meeting) emit(job.t + 1, lead, 'meeting', { channel: job.channel, manager: CH.call.transferTo });
          stopLead(job.t, lead, st, 'reply', job.channel);
          break;
        }
        default: break;
      }
    }

    let guard = 0;
    while (queue.length && guard++ < 200000) {
      const job = queue.shift();
      const st = S.get(job.lead.id);
      if (job.kind === 'outcome') { onOutcome(job, st); continue; }
      if (st.stopped) continue; // safety net: cancelled jobs are removed in stopLead()
      if (job.kind === 'like') { onLike(job); continue; }
      onStep(job, st);
    }

    return summarize({ seed, startT, events, steps, usage, leads });
  }

  /** Aggregate the raw timeline into forecast-friendly structures. */
  function summarize({ seed, startT, events, steps, usage, leads }) {
    events.sort((a, b) => a.t - b.t || a.seq - b.seq);
    const startDay = Math.floor(startT / DAY);
    const lastT = events.length ? events[events.length - 1].t : startT;
    const endT = Math.max(lastT + 30, startT + DAY);
    const days = Math.max(1, Math.floor(endT / DAY) - startDay + 1);
    const byDay = Array.from({ length: days }, (_, d) => ({ day: d + 1, byCh: {}, sends: 0, deferred: 0, limit: 0, replies: 0 }));
    const stepStats = {};
    for (const s of steps) stepStats[s.id] = { sent: 0, skipped: 0, deferred: 0, limit: 0 };
    const stats = {
      leads: leads.length, sends: 0, contacted: 0, opens: 0, clicks: 0, humanReplies: 0, positive: 0,
      deferred: 0, night: 0, weekend: 0, limit: 0, cascades: 0, stripped: 0, stops: 0, cancelled: 0,
      skips: 0, bounces: 0, meetings: 0, amd: 0, unsub: 0, autoReplies: 0, rotations: 0,
    };
    const contacted = new Set();
    for (const e of events) {
      const d = byDay[Math.floor(e.t / DAY) - startDay];
      const ss = e.step ? stepStats[e.step] : null;
      switch (e.type) {
        case 'send': case 'call':
          stats.sends++; contacted.add(e.lead);
          if (d) { d.sends++; d.byCh[e.channel] = (d.byCh[e.channel] || 0) + 1; }
          if (ss && e.kind !== 'call_followup' && !(e.type === 'call' && e.attempt > 1)) ss.sent++;
          break;
        case 'open': stats.opens++; break;
        case 'click': stats.clicks++; break;
        case 'reply':
          stats.humanReplies++; if (d) d.replies++;
          if (e.intent === 'interested') stats.positive++;
          break;
        case 'deferred': stats.deferred++; stats[e.reason === 'weekend' ? 'weekend' : 'night']++; if (d) d.deferred++; if (ss) ss.deferred++; break;
        case 'limit': stats.limit++; if (d) d.limit++; if (ss) ss.limit++; break;
        case 'cascade': stats.cascades++; break;
        case 'link_stripped': stats.stripped++; break;
        case 'auto_stop': stats.stops++; stats.cancelled += e.cancelled || 0; break;
        case 'skip': case 'no_channel': stats.skips++; if (ss) ss.skipped++; break;
        case 'bounce': stats.bounces++; break;
        case 'meeting': stats.meetings++; break;
        case 'amd': stats.amd++; break;
        case 'unsubscribe': stats.unsub++; break;
        case 'auto_reply': stats.autoReplies++; break;
        case 'rotation': stats.rotations++; break;
        default: break;
      }
    }
    stats.contacted = contacted.size;
    return { seed, startT, endT, days, events, byDay, stepStats, stats, usage: { ...usage } };
  }

  /* ------------------------------------------------------------------ */
  /* Projection: what the world looks like at minute T                   */
  /* ------------------------------------------------------------------ */

  const LIGHT = { interested: 'green', question: 'yellow', later: 'yellow', negative: 'red', stop: 'red' };

  function upperBound(events, T) {
    let lo = 0;
    let hi = events.length;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (events[m].t <= T) lo = m + 1; else hi = m;
    }
    return lo;
  }

  /**
   * Fold all events up to minute T into per-lead state and live metrics.
   * O(n) over visible events — cheap enough to recompute on every frame.
   */
  function project(result, T) {
    const n = upperBound(result.events, T);
    const leads = Object.create(null);
    const m = {
      sends: 0, contacted: 0, opened: 0, clicked: 0, replied: 0, green: 0, yellow: 0, red: 0,
      night: 0, weekend: 0, limit: 0, cascades: 0, stripped: 0, stops: 0, cancelled: 0,
      meetings: 0, amd: 0, bounces: 0, skips: 0, unsub: 0, rotations: 0,
    };
    const stepStats = Object.create(null);
    const lead = (id) => leads[id] || (leads[id] = {
      touches: 0, opened: false, clicked: false, reply: null, stop: null, last: null, lastSend: null, channels: [],
    });
    for (let i = 0; i < n; i++) {
      const e = result.events[i];
      const L = e.lead ? lead(e.lead) : null;
      if (L) L.last = e;
      switch (e.type) {
        case 'send': case 'call':
          m.sends++;
          if (L.touches === 0) m.contacted++;
          L.touches++; L.lastSend = e;
          if (!L.channels.includes(e.channel)) L.channels.push(e.channel);
          if (e.step && e.kind !== 'call_followup') {
            const ss = stepStats[e.step] || (stepStats[e.step] = { sent: 0 });
            if (!(e.type === 'call' && e.attempt > 1)) ss.sent++;
          }
          break;
        case 'open': if (!L.opened) { L.opened = true; m.opened++; } break;
        case 'click': if (!L.clicked) { L.clicked = true; m.clicked++; } break;
        case 'reply':
          if (!L.reply) { m.replied++; m[LIGHT[e.intent] || 'yellow']++; }
          L.reply = e;
          break;
        case 'auto_stop': m.stops++; m.cancelled += e.cancelled || 0; L.stop = e; break;
        case 'deferred': m[e.reason === 'weekend' ? 'weekend' : 'night']++; break;
        case 'limit': m.limit++; break;
        case 'cascade': m.cascades++; break;
        case 'link_stripped': m.stripped++; break;
        case 'meeting': m.meetings++; break;
        case 'amd': m.amd++; break;
        case 'bounce': m.bounces++; break;
        case 'skip': case 'no_channel': m.skips++; break;
        case 'unsubscribe': m.unsub++; break;
        case 'rotation': m.rotations++; break;
        default: break;
      }
    }
    return { n, T, leads, metrics: m, stepStats };
  }

  return {
    DAY, SENDER_TZ, LAUNCH_T, STAGGER, MESSENGERS, CASCADE_DEFAULT, LIGHT,
    mulberry32, tzFromPhone, smsInfo, hasLink, findLinks, stripLinks,
    localInfo, inWindow, nextWindow, emailCap, conditionSupport, isFirstMessengerStep,
    simulate, project, upperBound,
  };
})();

      [rows[i], rows[j]] = [rows[j], rows[i]];
    }
    const first = rows.findIndex((r) => r.city === 'moscow');
    [rows[0], rows[first]] = [rows[first], rows[0]];

    return rows.map((row, i) => {
      const c = CITIES[row.city];
      const poolKey = row.pool;
      const [name, gender] = i === 0 ? ['Анна Смирнова', 'f'] : NAMES[poolKey][used[poolKey]++ % NAMES[poolKey].length];
      const coPool = COMPANIES[poolKey === 'kz' ? 'kz' : poolKey] || COMPANIES.us;
      const company = coPool[usedCo[poolKey]++ % coPool.length];
      const [firstName, lastName = ''] = name.split(' ');
      const phone = `${c.code} ${digits(rng, 3)} ${digits(rng, 4)}`;
      const has = reachFor(c.country, rng);
      if (i === 0) Object.assign(has, { email: true, whatsapp: true, telegram: true, linkedin: true });
      return {
        id: `L${String(i + 1).padStart(2, '0')}`,

  /** Build a lead from imported fields (CSV / pasted list). */
  function makeLead(fields, i) {
    const rng = Engine.mulberry32(hash(`${fields.email}|${fields.phone}|${fields.name}|${i}`));
    const phoneTz = Engine.tzFromPhone(fields.phone);
    const city = phoneTz ? phoneTz.city : 'moscow';
    const c = CITIES[city] || CITIES.moscow;
    const name = (fields.name || '').trim() || (fields.email ? fields.email.split('@')[0] : `Lead ${i + 1}`);
    const [firstName, ...rest] = name.split(/\s+/);
    const has = reachFor(c.country, rng);
    has.email = !!fields.email;
    has.phone = !!fields.phone;
    if (!has.phone) Object.assign(has, { whatsapp: false, telegram: false, signal: false });
    if (fields.linkedin) has.linkedin = true;
    return {
      id: `I${String(i + 1).padStart(3, '0')}`,
      name, firstName, lastName: rest.join(' '), gender: /[ая]$/i.test(firstName) ? 'f' : 'm',
      company: fields.company || '—', role: fields.role || '—',
      city, country: c.country, tz: phoneTz ? phoneTz.tz : c.tz, phone: fields.phone || '',
      email: fields.email || '', has, emailValid: rng() > 0.05, ooo: rng() < 0.05, persona: persona(rng),
    };
  }

  const EMAIL_RE = /[\w.+-]+@[\w-]+\.[\w.-]+/;
  const PHONE_RE = /\+?\d[\d\s\-()]{7,}\d/;

  /** Parse a CSV (comma / semicolon / tab) with a header row. */
  function parseCSV(text) {
    const lines = String(text || '').split(/\r?\n/).filter((l) => l.trim());
    if (!lines.length) return [];
    const delim = [';', '\t', ','].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
    const head = lines[0].split(delim).map((h) => h.trim().toLowerCase());
    const col = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
    const idx = {
      name: col('name', 'имя', 'фио'), email: col('email', 'mail', 'почт'), phone: col('phone', 'тел', 'mobile'),
      company: col('company', 'компан', 'org'), role: col('title', 'role', 'должн'), linkedin: col('linkedin'),
    };
    const hasHeader = Object.values(idx).some((v) => v >= 0);
    if (!hasHeader) return parseList(text);
    return lines.slice(1).map((line, i) => {
      const cells = line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ''));
      const get = (k) => (idx[k] >= 0 ? cells[idx[k]] || '' : '');
      return makeLead({ name: get('name'), email: get('email'), phone: get('phone'), company: get('company'), role: get('role'), linkedin: get('linkedin') }, i);
    }).filter((l) => l.email || l.phone);
  }

  /** Parse free-form lines like «Иван Петров, ivan@acme.ru, +7 495 123-45-67». */
  function parseList(text) {
    return String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line, i) => {
      const email = (line.match(EMAIL_RE) || [''])[0];
      const phone = (line.match(PHONE_RE) || [''])[0].trim();
      const name = line.replace(email, '').replace(phone, '').replace(/[,;|\t]+/g, ' ').replace(/\s+/g, ' ').trim();
      return makeLead({ name, email, phone }, i);
    }).filter((l) => l.email || l.phone);
  }

  function coverage(leads) {
    const c = { email: 0, linkedin: 0, whatsapp: 0, telegram: 0, signal: 0, phone: 0, sms: 0, call: 0 };
    for (const l of leads) for (const k of ['email', 'linkedin', 'whatsapp', 'telegram', 'signal', 'phone']) if (l.has[k]) c[k]++;
    c.sms = c.call = c.phone;
    return c;
  }

    if (lang === 'en') {
      g = g.replace(/^(i|we)\s+(really\s+)?(want|would like|'d like|need|plan)\s+to\s+/i, '');

    g = g.charAt(0).toLowerCase() + g.slice(1);
    const short = g.split(/[,;:—–]|\s(?:чтобы|to show|so that)\s/)[0].trim();

/**
 * Minimal keyed DOM morphing.
 *
 * Patches an existing DOM tree in place so it matches freshly rendered HTML.
 * Node identity survives re-renders, which keeps focus, caret position,
 * scroll offsets and running CSS transitions intact — the core benefit of a
 * virtual-DOM framework in ~100 lines and zero dependencies.
 *
 * Rules:
 *  - Elements with `data-key` are matched by key (and may move).
 *  - Other nodes are matched by position + tag name.
 *  - A focused <input>/<textarea> never has its value overwritten.
 */
const Morph = (() => {
  'use strict';

  // An inert document: parsed markup never executes scripts or loads resources.
  // All dynamic values are escaped by the view layer (see esc() in app.js).
  const parser = new DOMParser();
  const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-key') : null);

  function morphInto(container, html) {
    const doc = parser.parseFromString(`<!doctype html><body>${html}</body>`, 'text/html');
    morphChildren(container, doc.body);
  }

  function morphChildren(from, to) {
    const keyed = new Map();
    for (let c = from.firstChild; c; c = c.nextSibling) {
      const k = keyOf(c);
      if (k != null) keyed.set(k, c);
    }
    let cursor = from.firstChild;
    for (const next of Array.from(to.childNodes)) {
      const k = keyOf(next);
      let match = null;
      if (k != null) {
        const cand = keyed.get(k);
        if (cand && cand.nodeName === next.nodeName) { match = cand; keyed.delete(k); }
      } else if (cursor && keyOf(cursor) == null && cursor.nodeType === next.nodeType && cursor.nodeName === next.nodeName) {
        match = cursor;
      }
      if (match) {
        if (match === cursor) cursor = cursor.nextSibling;
        else from.insertBefore(match, cursor);
        patch(match, next);
      } else {
        from.insertBefore(next, cursor); // adopt the freshly parsed node
      }
    }
    while (cursor) {
      const n = cursor.nextSibling;
      from.removeChild(cursor);
      cursor = n;
    }
  }

  function syncAttributes(a, b) {
    for (let i = a.attributes.length - 1; i >= 0; i--) {
      const name = a.attributes[i].name;
      if (!b.hasAttribute(name)) a.removeAttribute(name);
    }
    for (const at of b.attributes) {
      if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    }
  }

  function patch(a, b) {
    if (a.nodeType === 3 || a.nodeType === 8) {
      if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
      return;
    }
    if (a.nodeType !== 1) return;
    syncAttributes(a, b);
    const focused = document.activeElement === a;
    switch (a.nodeName) {
      case 'INPUT': {
        if (a.type === 'checkbox' || a.type === 'radio') {
          a.checked = b.hasAttribute('checked');
        } else if (!focused) {
          const v = b.getAttribute('value') ?? '';
          if (a.value !== v) a.value = v;
        }
        return;
      }
      case 'TEXTAREA': {
        const v = b.textContent;
        if (!focused && a.value !== v) a.value = v;
        return;
      }
      case 'SELECT': {
        morphChildren(a, b);
        const sel = b.querySelector('option[selected]');
        const v = sel ? sel.getAttribute('value') ?? sel.textContent : (a.options[0] && a.options[0].value);
        if (v != null && a.value !== v) a.value = v;
        return;
      }
      default:
        morphChildren(a, b);
    }
  }

  return { morphInto };
})();

/**
 * Relay App — core: helpers, state, persistence, derived data, validation.
 *
 * Architecture (see docs/ARCHITECTURE.md):
 *   state  ──►  App() view functions  ──►  HTML string  ──►  Morph  ──►  DOM
 *     ▲                                                         │
 *     └──── actions (data-action) / bindings (data-bind) ◄─────┘
 *
 * One mutable `state` object is the single source of truth. Both modes (Simple
 * and PRO) render the very same campaign — switching modes never loses data.
 */

const SAVE_KEY = 'relay.prototype.v1';
const params = new URLSearchParams(location.search);
if (params.has('reset')) { try { localStorage.removeItem(SAVE_KEY); } catch (_) { /* private mode */ } }

/* ------------------------------------------------------------------ */
/* Generic helpers                                                     */
/* ------------------------------------------------------------------ */

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** Escape every dynamic value before it reaches markup. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);
const cls = (...xs) => xs.filter(Boolean).join(' ');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad2 = (n) => String(n).padStart(2, '0');
const sumValues = (o) => Object.values(o).reduce((a, b) => a + b, 0);
const L = (pair) => Data.L(pair, state.ui.lang);
const clone = (o) => JSON.parse(JSON.stringify(o));

function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

/* State                                                               */
/* ------------------------------------------------------------------ */

function freshState(lang) {
  return {
    v: 1,
    ui: {
      mode: 'simple', lang, view: 'builder', wizardStep: 1,
      source: null, pasteText: '',
      expanded: {}, stepTab: {}, msgrTab: 'whatsapp', rulesOpen: false,
      editStep: null, editingDraft: null, addMenu: false,
      gen: null, voice: null,
      inbox: { light: 'all', channel: 'all', q: '', selected: null, draft: '', draftChannel: '' },
      liveTab: 'leads', logFilter: 'all',
      drawer: false, toast: null, launching: false,
      previewLead: 0, tzProbe: '+1 415 555 0192', newStopWord: '',
    },
    campaign: Data.defaultCampaign(lang),
    sim: { launched: false, t: Engine.LAUNCH_T, playing: false, speed: 240, seed: 42, snapshot: null, launchId: 0 },
    inboxLocal: { read: {}, overrides: {}, sent: [], meetings: {} },
    analytics: [],
    session: { startedAt: Date.now(), firstInteractionAt: null, modeSwitches: 0, launchedAt: null },
  };
}

/** UI fields that are never restored after a reload (transient overlays, timers). */
const TRANSIENT_UI = ['gen', 'voice', 'toast', 'launching', 'editStep', 'editingDraft', 'addMenu', 'drawer'];

function loadState() {
  const lang = params.get('lang') === 'en' ? 'en' : 'ru';
  const fresh = freshState(lang);
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return { state: fresh, restored: false };
    const saved = JSON.parse(raw);
    if (saved.v !== fresh.v) return { state: fresh, restored: false };
    const ui = { ...fresh.ui, ...saved.ui, inbox: { ...fresh.ui.inbox, ...(saved.ui || {}).inbox } };
    for (const k of TRANSIENT_UI) ui[k] = fresh.ui[k];
    if (params.get('lang')) ui.lang = lang;
    return {
      restored: true,
      state: {
        ...fresh, ...saved, ui,
        sim: { ...fresh.sim, ...saved.sim, playing: false },
        session: { ...fresh.session, startedAt: Date.now() },
      },
    };
  } catch (_) {
    return { state: fresh, restored: false };
  }
}

const boot = loadState();
const state = boot.state;

let persistTimer = 0;
function persistSoon() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) { /* quota / private mode */ }
  }, 400);
}

/** Campaign revision — bumped on every campaign mutation, invalidates forecasts & checks. */
let rev = 0;
const memo = new Map();
function memoize(key, deps, fn) {
  const m = memo.get(key);
  if (m && m.deps === deps) return m.val;
  const val = fn();
  memo.set(key, { deps, val });
  return val;
}
function bump() { rev++; persistSoon(); }

/** Dry-run of the current settings — powers the PRO forecast and the Simple launch bar. */
const forecast = () => memoize('forecast', `${rev}:${state.sim.seed}`, () => Engine.simulate(state.campaign, { seed: state.sim.seed }));

let liveRes = null;
let liveResId = -1;
/** Frozen timeline of the launched campaign (recomputed lazily after a reload). */
function liveResult() {
  if (!state.sim.launched || !state.sim.snapshot) return null;
  if (!liveRes || liveResId !== state.sim.launchId) {
    liveRes = Engine.simulate(state.sim.snapshot, { seed: state.sim.seed });
    liveResId = state.sim.launchId;
  }
  return liveRes;
}

function liveProj() {
  const r = liveResult();
  if (!r) return null;
  const n = Engine.upperBound(r.events, state.sim.t);
  return memoize('proj', `${state.sim.launchId}:${n}`, () => Engine.project(r, state.sim.t));
}

const liveLeads = () => memoize('liveLeads', state.sim.launchId, () => {
  const map = Object.create(null);
  for (const l of (state.sim.snapshot ? state.sim.snapshot.leads : [])) map[l.id] = l;
  return map;
});
const leadById = (id) => liveLeads()[id] || state.campaign.leads.find((l) => l.id === id);

/** All events of the live run grouped by lead (chronological). */
const eventsByLead = () => memoize('byLead', state.sim.launchId, () => {
  const out = Object.create(null);
  for (const e of (liveResult() || { events: [] }).events) if (e.lead) (out[e.lead] || (out[e.lead] = [])).push(e);
  return out;
});

let evtSeq = 0;
function track(name, props = {}) {

  if (state.analytics.length > 300) state.analytics.shift();

  persistSoon();
}

const MESSENGERS = Engine.MESSENGERS;
const SAFE_PER_NUMBER = { whatsapp: 30, telegram: 40, signal: 40 };
const chColor = (ch) => (Data.CHANNELS[ch] || Data.CHANNELS.messenger).color;
const chName = (ch) => t(`ch.${ch}`);
const isMessengerStep = (s) => s.channel === 'messenger' || MESSENGERS.includes(s.channel);

const steps = () => state.campaign.steps;
const stepById = (id) => steps().find((s) => s.id === id);
const stepIndex = (id) => steps().findIndex((s) => s.id === id);
const stepNo = (s) => stepIndex(s.id) + 1;
const lastDay = () => Math.max(1, ...steps().map((s) => s.day));
const dow = (day) => (day - 1) % 7; // the campaign starts on a Monday
const isWeekendDay = (day) => dow(day) >= 5;

/** Plain-language step title used in Simple mode (by template slot). */
function stepTitle(s) {
  if (s.channel === 'linkedin') return s.kind === 'message' ? t('tpl.li_message') : t('tpl.li_invite');
  if (MESSENGERS.includes(s.channel)) return t('tpl.msg_pinned', { ch: chName(s.channel) });
  return t(`tpl.${s.tpl}`) || chName(s.channel);
}

/** What the referenced step "is" in plain words («письмо», «сообщение»…). */
function stepNoun(s) {
  if (!s) return '';
  if (s.channel === 'email') return t('noun.email');
  if (s.channel === 'linkedin') return t('noun.linkedin');
  if (s.channel === 'sms') return t('noun.sms');
  if (s.channel === 'call') return t('noun.call');
  return t('noun.messenger');
}

function condPlain(s) {
  if (stepIndex(s.id) === 0) return t('cond.plain.first');
  if (s.condition === 'no_reply' || !s.ref) return t('cond.plain.no_reply');
  return t(`cond.plain.${s.condition}`, { what: stepNoun(stepById(s.ref)) });
}

const PLACEHOLDER_LEAD = { id: 'P', firstName: 'Анна', name: 'Анна Смирнова', company: 'ЛогиТех', city: 'moscow', role: 'CEO', tz: 3, has: {} };
const sampleLead = () => state.campaign.leads[state.ui.previewLead] || state.campaign.leads[0] || PLACEHOLDER_LEAD;
/** The lead with the longest name/company — used for worst-case SMS length checks. */
const worstLead = () => memoize('worstLead', state.campaign.leads, () => state.campaign.leads.reduce(
  (w, l) => ((l.firstName.length + l.company.length) > (w.firstName.length + w.company.length) ? l : w), PLACEHOLDER_LEAD));

const personalize = (text, lead) => Data.personalize(text, lead, state.ui.lang);
const smsInfoFor = (s) => Engine.smsInfo(personalize(s.text, worstLead()));

/** Keep steps ordered by day and make sure every condition references an earlier step. */
function normalizeSteps() {
  const list = steps();
  list.sort((a, b) => a.day - b.day);
  list.forEach((s, i) => {
    if (i === 0) { s.condition = 'no_reply'; s.ref = null; return; }
    if (s.condition === 'no_reply') { s.ref = null; return; }
    const earlier = list.slice(0, i);
    if (!s.ref || !earlier.some((p) => p.id === s.ref)) {
      const ref = bestRef(s, s.condition, earlier);
      if (ref) s.ref = ref.id; else { s.condition = 'no_reply'; s.ref = null; }
    }
  });
}

/** The most sensible earlier step for a condition (latest one that can report it). */
function bestRef(s, cond, earlier = steps().slice(0, stepIndex(s.id))) {
  const supports = (p) => {
    const sup = Engine.conditionSupport(p, state.campaign);
    return cond === 'clicked' ? sup.clickable : sup.readable;
  };
  return [...earlier].reverse().find(supports) || [...earlier].reverse().find((p) => p.channel !== 'call') || earlier[earlier.length - 1] || null;
}

/** Condition picker options with availability reasons. */
function condOptions(s) {
  const first = stepIndex(s.id) === 0;
  const earlier = steps().slice(0, stepIndex(s.id));
  const anyReadable = earlier.some((p) => Engine.conditionSupport(p, state.campaign).readable);
  const anyClickable = earlier.some((p) => Engine.conditionSupport(p, state.campaign).clickable);
  return ['no_reply', 'opened', 'not_opened', 'clicked'].map((id) => {
    let reason = '';
    if (first && id !== 'no_reply') reason = t('cond.r.first');
    else if ((id === 'opened' || id === 'not_opened') && !anyReadable) reason = t('cond.r.noRead');
    else if (id === 'clicked' && !anyClickable) reason = t('cond.r.noLink');
    return { id, label: t(`cond.${id}`), disabled: first && id !== 'no_reply', reason };
  });
}

/** Is a branching condition actually observable with the current tracking settings? */
function condIssue(s) {
  if (s.condition === 'no_reply' || !s.ref) return null;
  const ref = stepById(s.ref);
  if (!ref) return null;
  const sup = Engine.conditionSupport(ref, state.campaign);
  if ((s.condition === 'opened' || s.condition === 'not_opened') && !sup.readable) {
    const pixelOff = ref.channel === 'email' && !state.campaign.channels.email.trackOpens;
    const refClickable = sup.clickable;
    return {
      level: 'warn', code: pixelOff ? 'pixel_off' : 'not_readable',
      text: pixelOff ? t('v.pixelOff', { r: stepNo(ref) }) : t('v.notReadable', { r: stepNo(ref) }),
      fix: pixelOff
        ? (refClickable ? { arg: `cond-clicked:${s.id}`, label: t('fix.toClicked') } : { arg: 'pixel-on', label: t('fix.pixelOn') })
        : null,
    };
  }
  if (s.condition === 'clicked' && !sup.clickable) {
    return { level: 'warn', code: 'no_link', text: t('v.noLink', { r: stepNo(ref) }), fix: null };
  }
  return null;
}

/** Per-step validation — shown inline in the PRO editor and aggregated by the preflight. */
function validateStep(s) {
  const notes = [];
  const C = state.campaign.channels;
  const text = s.text || '';
  if (!text.trim()) notes.push({ level: 'error', code: 'empty', text: t('v.empty'), fix: { arg: 'ai-fill', label: t('fix.aiFill') } });
  if (isMessengerStep(s) && Engine.hasLink(text) && Engine.isFirstMessengerStep(s, state.campaign)) {
    const guarded = s.channel === 'messenger' ? MESSENGERS.every((m) => C[m].noLinksFirst) : C[s.channel].noLinksFirst;
    notes.push(guarded
      ? { level: 'warn', code: 'link_first', text: t('v.linkFirst.on') }
      : { level: 'warn', code: 'link_first_off', text: t('v.linkFirst.off'), fix: { arg: `links-on:${s.channel === 'messenger' ? '' : s.channel}`, label: t('fix.linksOn') } });
  }
  if (s.channel === 'sms') {
    const info = smsInfoFor(s);
    if (info.segments > 1 && C.sms.singleSegment) {
      notes.push({ level: 'error', code: 'sms_long', text: t('v.smsLong', { n: info.length, max: info.perSegment }), fix: { arg: `sms-shorten:${s.id}`, label: t('fix.shorten') } });
    } else if (info.segments > 1) {
      notes.push({ level: 'warn', code: 'sms_multi', text: t('v.smsMulti', { n: info.segments }) });
    }
  }
  if (s.channel === 'linkedin' && s.kind !== 'message' && C.linkedin.inviteNote && text.length > 300) {
    notes.push({ level: 'error', code: 'li_long', text: t('v.liLong', { n: text.length }), fix: { arg: `li-trim:${s.id}`, label: t('fix.shorten') } });
  }
  if (s.channel === 'email' && text.trim() && !(s.subject || '').trim()) notes.push({ level: 'warn', code: 'no_subject', text: t('v.noSubject') });

  if (ci) notes.push(ci);

}

const usesChannel = (ch) => steps().some((s) => s.channel === ch
  || (s.channel === 'messenger' && state.campaign.rules.cascade.some((c) => c.on && c.id === ch)));

/** Campaign preflight: blocking errors, warnings with one-click fixes, and green checks. */
function preflight() {
  return memoize('preflight', `${rev}:${state.ui.lang}`, () => {
    const c = state.campaign;
    const C = c.channels;
    const out = [];
    if (!c.leads.length) out.push({ level: 'error', text: t('pf.noLeads'), fix: { action: 'pickSource', arg: 'demo', label: t('aud.demo') } });
    for (const s of c.steps) {
      for (const n of validateStep(s)) out.push({ ...n, step: s.id, text: `#${stepNo(s)} · ${n.text}` });
    }
    if (usesChannel('linkedin') && C.linkedin.inviteLimit > 25) out.push({ level: 'warn', text: t('pf.liLimit', { n: C.linkedin.inviteLimit }), fix: { arg: 'li-limit', label: t('fix.liLimit') } });
    if (usesChannel('linkedin') && C.linkedin.proxy === 'none') out.push({ level: 'warn', text: t('pf.noProxy'), fix: { arg: 'proxy-on', label: t('fix.proxy') } });
    if (usesChannel('email') && C.email.dailyLimit > 60) out.push({ level: 'warn', text: t('pf.emailLimit', { n: C.email.dailyLimit }), fix: { arg: 'email-limit', label: t('fix.emailLimit') } });
    if (usesChannel('email') && !C.email.warmup.enabled) out.push({ level: 'warn', text: t('pf.noWarmup'), fix: { arg: 'warmup-on', label: t('fix.warmup') } });
    if (usesChannel('email') && !C.email.mailboxes.some((m) => m.enabled)) out.push({ level: 'error', text: t('pf.noMailbox'), fix: { arg: 'mailbox-on', label: t('fix.mailbox') } });
    for (const m of MESSENGERS) {
      if (!usesChannel(m)) continue;
      if (C[m].dailyPerNumber > SAFE_PER_NUMBER[m]) out.push({ level: 'warn', text: t('pf.msgLimit', { ch: chName(m), n: C[m].dailyPerNumber, safe: SAFE_PER_NUMBER[m] }), fix: { arg: `msg-limit:${m}`, label: t('fix.msgLimit', { n: SAFE_PER_NUMBER[m] }) } });
      if (!C[m].typing) out.push({ level: 'warn', text: t('pf.noTyping', { ch: chName(m) }), fix: { arg: `typing-on:${m}`, label: t('fix.typing') } });
    }
    if (usesChannel('call') && !C.call.amd) out.push({ level: 'warn', text: t('pf.noAmd'), fix: { arg: 'amd-on', label: t('fix.amd') } });
    out.push({ level: 'ok', text: t('pf.ok.stop') });
    out.push({ level: 'ok', text: t('pf.ok.hours', { a: c.rules.workStart, b: c.rules.workEnd }) });
    if (steps().some((s) => s.channel === 'messenger')) out.push({ level: 'ok', text: t('pf.ok.cascade', { list: c.rules.cascade.filter((x) => x.on).map((x) => chName(x.id)).join(' → ') }) });
    const rank = { error: 0, warn: 1, ok: 2 };
    return out.sort((a, b) => rank[a.level] - rank[b.level]);
  });
}

/**
 * Ban-risk score (0–100). A transparent heuristic: every risky setting adds
 * points, so PRO users see exactly which knob moves the needle.
 */
function riskScore() {
  return memoize('risk', rev, () => {
    const C = state.campaign.channels;
    let s = 6;
    if (usesChannel('email')) {
      s += C.email.dailyLimit > 60 ? 16 : C.email.dailyLimit > 45 ? 6 : 0;
      if (!C.email.warmup.enabled) s += 14;
      if (C.email.trackOpens) s += 4;
      s += C.email.mailboxes.filter((m) => m.enabled && m.health < 85).length * 4;
    }
    if (usesChannel('linkedin')) {
      const li = C.linkedin.inviteLimit;
      s += li > 30 ? 26 : li > 20 ? 12 : 0;
      if (C.linkedin.proxy === 'none') s += 12;
      if (!C.linkedin.likeWarmup) s += 4;
    }
    for (const m of MESSENGERS) {
      if (!usesChannel(m)) continue;
      if (!C[m].noLinksFirst) s += 10;
      if (!C[m].typing) s += 4;
      if (C[m].dailyPerNumber > SAFE_PER_NUMBER[m]) s += 9;
    }
    if (usesChannel('call') && !C.call.amd) s += 3;
    const score = clamp(Math.round(s), 0, 100);
    return { score, level: score < 30 ? 'low' : score < 60 ? 'mid' : 'high' };
  });
}

/** "AI" SMS shortener: trims filler, then cuts on a word boundary to fit one segment. */
function shortenSms(text) {
  let s = String(text || '').replace(/\s+/g, ' ').trim();
  const fits = (x) => Engine.smsInfo(personalize(x, worstLead())).segments <= 1;
  const cuts = [/ из Relay/, / from Relay/, /, это [^.]+\./, /, it's [^.]+\./, / на этой неделе/, / this week/];
  for (const re of cuts) { if (fits(s)) break; s = s.replace(re, re.source.startsWith(',') ? '.' : ''); }
  while (!fits(s) && s.includes(' ')) s = `${s.replace(/\s+\S+$/, '').replace(/[,.…]+$/, '')}…`.replace(/……$/, '…');
  return s;
}

function clockParts(t, tz) {
  const i = Engine.localInfo(Math.floor(t), tz);
  return { dow: i.dow, hh: i.hh, mm: i.mm, day: i.day };
}
const fmtHM = (T, tz) => { const p = clockParts(T, tz); return `${pad2(p.hh)}:${pad2(p.mm)}`; };
const fmtDHM = (T, tz) => { const p = clockParts(T, tz); return `${t(`dow.${p.dow}`)} ${pad2(p.hh)}:${pad2(p.mm)}`; };
const campaignDay = (T) => Math.floor((T + Engine.SENDER_TZ * 60) / Engine.DAY) - Math.floor((Engine.LAUNCH_T + Engine.SENDER_TZ * 60) / Engine.DAY) + 1;
const tzLabel = (tz) => `UTC${tz >= 0 ? '+' : '−'}${Math.abs(tz)}`;
const cityName = (city) => (Data.CITIES[city] ? L(Data.CITIES[city].name) : city);

function Range(path, value, min, max, step, { safe, danger, unit }) {

  return `<div class="${cls('range', `zone-${zone}`)}" style="--p:${pct(value)}%;--safe:${pct(safe)}%;--danger:${pct(danger ?? safe * 1.5)}%">

    <div class="range-meta"><b class="mono">${value}</b><span>${unit}</span><em>${t(`range.${zone}`)}</em></div>

const sortedForView = () => [...steps()].sort((a, b) => a.day - b.day);

function DraftCard(s, lead, i) {
  const editing = state.ui.editingDraft === s.id;
  const idx = stepIndex(s.id);

function WizTrack() {
  return `<header class="card-head"><span class="step-kicker">${t('wiz.kicker', { n: 3 })}</span><h2>${t('track.title')}</h2><p>${t('track.sub')}</p></header>

    ${AddStepMenu()}
    ${Autopilot()}
    ${LaunchBar()}`;

/** The visual "track": a day ruler with step bubbles placed on their day. Shared by builder and live views. */
function Track({ live, proj, list = sortedForView() }) {
  const days = Math.max(8, Math.max(1, ...list.map((s) => s.day)) + 1);
  const rowOf = {};
  const perDay = {};
  for (const s of list) { rowOf[s.id] = (perDay[s.day] = (perDay[s.day] || 0) + 1); }
  const progress = live ? clamp((state.sim.t - Engine.LAUNCH_T) / (days * Engine.DAY), 0, 1) : 0;
  return `<div class="${cls('track', live && 'is-live')}" style="--days:${days}" data-testid="track">
    <div class="track-ruler">${Array.from({ length: days }, (_, i) => {
    const d = i + 1;
    const we = isWeekendDay(d);
    return `<div class="${cls('ruler-day', we && 'is-weekend', live && campaignDay(state.sim.t) === d && 'is-today')}"><b>${t(`dow.${dow(d)}`)}</b><small>${t('day.n', { n: d })}</small>${we ? `<em>${icon('moon')} ${t('track.weekend')}</em>` : ''}</div>`;
  }).join('')}</div>
    <div class="track-lane">
      <div class="track-line" aria-hidden="true"><i style="width:${progress * 100}%"></i></div>
      ${list.map((s) => TrackNode(s, rowOf[s.id], live, proj)).join('')}
      ${live ? '' : `<div class="tnode tnode-ghost" data-key="n-ghost" style="grid-column:${Math.min(days, Math.max(...list.map((s) => s.day)) + 1)};grid-row:1">
        <button class="tnode-bubble" data-action="toggleAddMenu" data-testid="add-step" aria-expanded="${state.ui.addMenu}" aria-label="${t('track.add')}">${icon('plus')}</button>
        <div class="tnode-title">${t('track.add')}</div></div>`}
    </div>
  </div>`;
}

function TrackNode(s, row, live, proj) {
  const sent = live && proj ? (proj.stepStats[s.id] || { sent: 0 }).sent : 0;
  const shifted = isWeekendDay(s.day) && state.campaign.rules.skipWeekends;
  return `<div class="${cls('tnode', live && sent > 0 && 'is-hit')}" data-key="n-${s.id}" style="grid-column:${s.day};grid-row:${row};--c:${chColor(s.channel)}">
    <button class="tnode-bubble" ${live ? 'tabindex="-1"' : `data-action="openStep" data-arg="${s.id}"`} aria-label="${esc(stepTitle(s))}" data-testid="node-${s.id}">
      ${chIcon(s.channel)}${s.channel === 'messenger' ? `<span class="tnode-cascade" aria-hidden="true">${state.campaign.rules.cascade.filter((c) => c.on).map((c) => `<i style="--c:${chColor(c.id)}"></i>`).join('')}</span>` : ''}
      ${live && sent ? `<span class="tnode-count mono">${sent}</span>` : ''}
    </button>
    <div class="tnode-title">${stepTitle(s)}</div>
    <div class="tnode-cond">${condPlain(s)}</div>
    ${shifted ? `<div class="tnode-shift">${icon('moon')} ${t('track.shift')}</div>` : ''}
  </div>`;
}

function AddStepMenu() {
  if (!state.ui.addMenu) return '';
  const opts = ['email', 'messenger', 'linkedin', 'call', 'sms'];
  return `<div class="add-menu" data-key="add-menu" role="menu" data-testid="add-menu">
    <b>${t('add.title')}</b>
    <div class="add-grid">${opts.map((ch) => `<button role="menuitem" class="add-opt" style="--c:${chColor(ch)}" data-action="addStep" data-arg="${ch}" data-testid="add-${ch}">${ChBadge(ch, 'lg')}<b>${t(`add.${ch}`)}</b><small>${t(`add.${ch}.sub`)}</small></button>`).join('')}</div>
  </div>`;
}

/** Where the audience is right now at launch time — feeds the "working hours" card. */
function tzSamples() {
  const byTz = new Map();
  for (const l of state.campaign.leads) if (!byTz.has(l.tz)) byTz.set(l.tz, l);
  const list = [...byTz.values()].sort((a, b) => b.tz - a.tz);
  if (!list.length) return [];
  const pick = [list[0], list[Math.floor(list.length / 2)], list[list.length - 1]].filter((x, i, arr) => arr.indexOf(x) === i);
  return pick.map((l) => ({ city: cityName(l.city), time: fmtHM(Engine.LAUNCH_T, l.tz), ok: Engine.inWindow(Engine.LAUNCH_T, l.tz, state.campaign.rules) }));
}

/**

 * Left: campaign rules + expandable steps (message / logic / channel settings).
 * Right (sticky): logic map, ban-risk preflight with one-click fixes, forecast.

const TAB_IC = { message: 'edit', logic: 'git', channel: 'sliders' };
const ADD_CHANNELS = ['email', 'linkedin', 'messenger', 'whatsapp', 'telegram', 'signal', 'sms', 'call'];

function stepTitlePro(s) {
  return `${chName(s.channel)} · ${t(`tplShort.${s.channel === 'linkedin' ? (s.kind === 'message' ? 'li_message' : 'li_invite') : s.tpl}`)}`;
}

function stepMeta(s) {
  const C = state.campaign.channels;
  const time = s.sendAt === 'auto' ? t('pro.time.auto') : `${pad2(s.sendAt)}:00 ${t('pro.local')}`;
  let extra = '';
  if (s.channel === 'email') extra = t('pro.meta.email', { n: C.email.mailboxes.filter((m) => m.enabled).length, l: C.email.dailyLimit });
  else if (s.channel === 'messenger') extra = state.campaign.rules.cascade.filter((c) => c.on).map((c) => chName(c.id)).join(' → ');
  else if (s.channel === 'linkedin') extra = s.kind === 'message' ? t('pro.meta.liMsg') : `${C.linkedin.likeWarmup ? `${t('pro.meta.like')} + ` : ''}${t('pro.meta.invite', { n: C.linkedin.inviteLimit })}`;
  else if (MESSENGERS.includes(s.channel)) extra = t('pro.meta.pinned', { n: C[s.channel].dailyPerNumber });
  else if (s.channel === 'sms') { const i = smsInfoFor(s); extra = `${i.length}/${i.perSegment} · ${i.encoding}`; }
  else if (s.channel === 'call') extra = t(`call.mode.${C.call.mode}`);
  return `${t('day.n', { n: s.day })} · ${time} · ${extra}`;
}

function condShort(s) {
  if (stepIndex(s.id) === 0) return t('cond.short.start');
  if (s.condition === 'no_reply' || !s.ref) return t('cond.short.no_reply');
  return t(`cond.short.${s.condition}`, { r: stepNo(stepById(s.ref)) });
}

function ProBuilder() {
  const c = state.campaign;
  const f = forecast();
  const checks = preflight();
  const chCount = new Set(c.steps.map((s) => s.channel)).size;
  const hasErrors = checks.some((x) => x.level === 'error');
  return `<main class="pro" data-testid="pro-builder">

        <div class="pro-title">
          <input class="camp-name" data-bind="campaign.name" value="${esc(c.name)}" aria-label="${t('pro.name')}">
          <div class="meta-chips">
            <span>${icon('users')} ${t('pro.m.leads', { n: c.leads.length })}</span>
            <span>${icon('git')} ${t('pro.m.steps', { n: c.steps.length })}</span>
            <span>${icon('layers')} ${t('pro.m.channels', { n: chCount })}</span>
            <span>${icon('calendar')} ${t('pro.m.days', { n: f.days })}</span>
            <span>${icon('reply')} ${t('pro.m.replies', { n: f.stats.humanReplies, p: c.leads.length ? Math.round((f.stats.humanReplies / c.leads.length) * 100) : 0 })}</span>
          </div>
        </div>
        <div class="pro-actions">
          <button class="btn btn-ghost" data-action="generate" ${c.goal.trim().length < 8 || state.ui.gen ? 'disabled' : ''} title="${t('pro.ai.title')}">${state.ui.gen ? '<span class="spin"></span>' : icon('sparkles')} ${t('pro.ai')}</button>
          <button class="btn btn-primary" data-action="launch" data-testid="pro-launch" ${hasErrors ? 'disabled' : ''}>${icon('rocket')} ${t('pro.launch')}</button>
        </div>
      </div>
      ${c.leads.length ? '' : `<div class="banner warn">${icon('alert')} <span>${t('pro.noLeads')}</span><button class="btn btn-soft" data-action="pickSource" data-arg="demo">${t('aud.demo')}</button></div>`}
      ${c.goal.trim() ? '' : `<div class="banner">${icon('target')} <span>${t('pro.noGoal')}</span><input class="inp" data-bind="campaign.goal" value="${esc(c.goal)}" placeholder="${t('goal.ph')}"></div>`}
      ${RulesPanel()}
      <div class="seq" data-testid="seq">
        ${sortedForView().map((s, i) => StepRow(s, i, f, checks)).join('')}
      </div>
      <div class="add-pro">
        <span>${icon('plus')} ${t('pro.add')}</span>
        ${ADD_CHANNELS.map((ch) => `<button class="add-ch" style="--c:${chColor(ch)}" data-action="addStep" data-arg="${ch}" title="${chName(ch)}">${chIcon(ch)}<span>${chName(ch)}</span></button>`).join('')}
      </div>
    </section>
    <aside class="pro-side">
      ${LogicMap(f)}
      ${RiskPanel(checks)}
      ${ForecastPanel(f)}
    </aside>
  </main>`;
}
